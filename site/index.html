<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Makes the page scale properly on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Serie A Analytics</title>
    <meta name="description" content="Predictions for every Serie A match, and how they turned out." />
    <meta name="theme-color" content="#0f4a32" />
    <!-- Fonts: Barlow (text) and Barlow Condensed (headings), a sporty, scoreboard-like family -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a class="brand" href="./">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="16" r="15" fill="#ffffff" />
            <polygon points="16,10 21.7,14.1 19.5,20.9 12.5,20.9 10.3,14.1" fill="#14171a" />
            <path d="M16 10V2.5M21.7 14.1l7-2.3M19.5 20.9l4.3 6M12.5 20.9l-4.3 6M10.3 14.1l-7-2.3" stroke="#14171a" stroke-width="1.6" fill="none" />
          </svg>
          Serie A Analytics
        </a>
        <nav class="nav">
          <a href="./" aria-current="page">Matches</a>
          <a href="table.html">Table</a>
          <a href="model.html">How it works</a>
          <a href="lab.html">Data lab</a>
          <a href="about.html">About</a>
        </nav>
      </div>
    </header>

    <section class="hero">
      <div class="container">
        <h1>Serie A <span id="season"></span></h1>
        <p>Our prediction for every match, and how it turned out.</p>
        <nav class="md-strip" aria-label="Matchdays">
          <button class="strip-arrow" id="prev" aria-label="Previous matchday">‹</button>
          <div class="md-scroller" id="md-scroller"></div>
          <button class="strip-arrow" id="next" aria-label="Next matchday">›</button>
        </nav>
      </div>
    </section>

    <main class="container">
      <!-- The script fills these empty sections with data -->
      <section id="talking-points"></section>
      <div id="matchday"></div>
    </main>

    <footer class="site-footer">
      <div class="container small muted">
        Data: <a href="https://www.football-data.co.uk/">football-data.co.uk</a> and
        <a href="https://github.com/openfootball/football.json">openfootball</a>.
        An independent analysis project, not affiliated with Lega Serie A or any club. Not betting advice.
        <span id="updated"></span>
      </div>
    </footer>
    <script type="module" src="js/home.js"></script>
  </body>
</html>
