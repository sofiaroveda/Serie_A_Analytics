[project]
name = "serie-a-analytics"
version = "0.1.0"
description = "Serie A match predictions (Elo, Dixon-Coles) compared with bookmaker odds."
requires-python = ">=3.11"
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.6",
    "requests==2.34.2",
    "scipy==1.18.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
tools = ["pillow==12.3.0"]  # only for tools/make_share_image.py (the link-preview image)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests can import `pipeline` and `tests.conftest` however pytest is started
