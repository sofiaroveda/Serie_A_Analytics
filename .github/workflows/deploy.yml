# Publishes the site/ folder to GitHub Pages every time main is pushed.
# GitHub runs this on its own machines; results appear in the repo's "Actions" tab.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

# Allow this workflow to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes happen close together, finish one deploy before starting the next
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest

  deploy:
    needs: test # only publish if the tests pass
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Tag every CSS/JS link with this commit's ID (e.g. style.css?v=4ad3795), so after an
      # update browsers download the new files instead of reusing old saved copies.
      - name: Add version tags to file links
        run: |
          VERSION="${GITHUB_SHA::7}"
          sed -i -E "s#(href|src)=\"((css|js)/[^\"?]+)\"#\1=\"\2?v=${VERSION}\"#g" site/*.html
          sed -i -E "s#from \"\./([^\"?]+\.js)\"#from \"./\1?v=${VERSION}\"#g" site/js/*.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
